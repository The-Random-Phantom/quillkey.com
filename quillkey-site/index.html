<title>quillkey</title>
<meta name="description" content="quillkey: a minimal, distraction-free text and code editor with a smooth caret, themes, and a built-in Python/C++ runner.">

<style>
:root{--bg:#16365a;--main:#6fdc9d;--caret:#6fdc9d;--sub:#356b8c;--alt:#12304f;--text:#e3f3ea;--fs:36px;--cw:20px;--ch:40px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--sub);font-family:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;transition:background .25s}
body{min-height:100vh;display:flex;flex-direction:column;padding:28px 48px}
.ui{transition:opacity .25s}
body.typing .ui{opacity:0;pointer-events:none}
body.typing{cursor:none}
header{display:flex;align-items:center;gap:22px;height:56px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);font-family:"Lexend Deca",sans-serif;font-size:36px;font-weight:600;letter-spacing:-1px;position:relative;line-height:1}
.logo small{position:absolute;left:46px;top:-12px;font-size:11px;font-weight:400;color:var(--sub);letter-spacing:0}
.logo svg{color:var(--main)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;transition:color .15s}
button:hover{color:var(--text)}
.ic{width:22px;height:22px;display:grid;place-items:center}
.sp{flex:1}
#status{font-size:13px}
#bar{display:flex;justify-content:center;gap:18px;margin:26px 0 0;flex-wrap:wrap}
.grp{display:flex;background:var(--alt);border-radius:9px;padding:0 8px;height:54px;align-items:center;gap:4px;font-size:15px}
.grp button{padding:8px 14px}
.grp button.on{color:var(--main)}
#info{text-align:center;color:var(--main);font-size:15px;height:24px;margin:70px 0 14px;transition:opacity .2s}
#wrap{position:relative;width:min(1180px,100%);margin:0 auto;font-size:var(--fs);line-height:1.55;flex:1 0 auto;cursor:text}
#ta,#mir,#hl{display:block;width:100%;margin:0;padding:0;border:0;font:inherit;line-height:inherit;letter-spacing:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4}
#ta{position:relative;background:transparent;color:var(--text);caret-color:transparent;outline:none;resize:none;overflow:hidden;min-height:46vh}
#ta::placeholder{color:var(--sub);opacity:1}
#ta::selection{background:var(--main);color:var(--bg)}
#mir{position:absolute;top:0;left:0;visibility:hidden;pointer-events:none}
#hl{position:absolute;top:0;left:0;pointer-events:none;color:var(--text);display:none}
body.code #hl{display:block}body.code #ta{color:transparent}
body.code #ta::selection{background:color-mix(in srgb,var(--main) 40%,transparent);color:transparent}
#hl .k{color:var(--main)}#hl .s{color:var(--str)}#hl .c{color:var(--sub);font-style:italic}#hl .n{color:var(--num)}#hl .f{color:var(--fn)}#hl .t{color:var(--ty)}#hl .p{color:var(--pp)}#hl .b{color:var(--ty)}#hl .d{color:var(--pp)}
#caret{position:absolute;left:0;top:0;width:3px;height:var(--ch);background:var(--caret);border-radius:2px;pointer-events:none;will-change:transform;z-index:2}
#caret.smooth{transition:transform .085s ease-out,width .1s,height .1s}
#caret.block{width:var(--cw);opacity:.55;border-radius:2px}
#caret.underline{width:var(--cw);height:4px;margin-top:calc(var(--ch) - 4px)}
#caret.outline{width:var(--cw);background:transparent;border:2px solid var(--caret)}
#caret.idle{animation:bl 1s steps(1) infinite}
#caret.hide{display:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
.hints{text-align:center;font-size:13px;line-height:2.1;margin:28px 0 22px}
kbd{font:inherit;font-size:11px;background:var(--sub);color:var(--bg);border-radius:4px;padding:2px 6px;margin-right:4px}
footer{display:flex;gap:22px;font-size:14px;align-items:center;flex-wrap:wrap}
footer button{display:flex;gap:7px;align-items:center}
#pal{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;justify-content:center;align-items:flex-start;padding-top:14vh;z-index:10}
#pal.open{display:flex}
#pb{width:min(600px,92vw);background:var(--bg);border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#pq{width:100%;background:var(--alt);border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:18px 22px}
#pl{max-height:48vh;overflow:auto}
#pl div{padding:10px 22px;font-size:14px;cursor:pointer}
#pl div.sel{background:var(--text);color:var(--bg)}
@media(max-width:700px){body{padding:16px 18px}header{gap:8px}#status{display:none}.grp{max-width:100%;flex-wrap:wrap;height:auto;min-height:48px;justify-content:center}#wrap{font-size:min(var(--fs),22px)}.logo{font-size:26px}#info{margin-top:36px}}
#run{position:fixed;left:0;right:0;bottom:0;height:36vh;background:var(--alt);border-top:2px solid var(--sub);display:none;flex-direction:column;z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
#run.open{display:flex}
body.runopen{padding-bottom:42vh}
.rh{display:flex;align-items:center;gap:6px;padding:6px 48px;font-size:14px}
.rh button{padding:6px 12px;border-radius:6px}.rh button:hover{background:var(--bg)}
#rRun{color:var(--main)}
.rh .lbl{color:var(--main)}
#rb{flex:1;display:flex;gap:18px;min-height:0;padding:0 48px 14px}
#out{flex:1;margin:0;overflow:auto;font:14px/1.5 "Roboto Mono",ui-monospace,monospace;color:var(--text);white-space:pre-wrap;word-break:break-word;user-select:text}
#rRun.stop{color:#ff6b6b}#out .u{color:var(--main)}#out .e{color:#ff6b6b}.ti{background:none;border:0;border-bottom:1px solid var(--main);color:var(--main);font:inherit;outline:0;padding:0;min-width:2ch}#out .m{color:var(--sub)}
#stdin{width:min(280px,30%);background:var(--bg);border:0;border-radius:8px;outline:0;resize:none;color:var(--text);font:14px/1.5 "Roboto Mono",ui-monospace,monospace;padding:10px}
#stdin::placeholder{color:var(--sub)}
@media(max-width:700px){.rh,#rb{padding-left:16px;padding-right:16px}#rb{flex-direction:column}#stdin{width:100%;height:60px;flex:none}}
#hl .h{color:var(--main)}
body:not(.md) [data-t="preview"],body:not(.md) [data-t="live"]{display:none}
#pv{display:none;width:min(820px,100%);margin:0 auto;flex:1 0 auto;color:var(--text);font:18px/1.7 "Lexend Deca",system-ui,sans-serif;overflow-wrap:break-word}
#pv h1,#pv h2,#pv h3,#pv h4,#pv h5,#pv h6{color:var(--main);line-height:1.25;margin:1.2em 0 .5em}
#pv h1{font-size:2em}#pv h2{font-size:1.5em}#pv h3{font-size:1.2em}
#pv code{font-family:"Roboto Mono",ui-monospace,monospace;background:var(--alt);padding:.1em .35em;border-radius:4px;font-size:.88em}
#pv pre{background:var(--alt);padding:14px 16px;border-radius:8px;overflow:auto}#pv pre code{background:none;padding:0}
#pv blockquote{margin:1em 0;padding-left:16px;border-left:3px solid var(--sub);color:var(--sub)}#pv blockquote p{margin:.3em 0}
#pv a{color:var(--main)}#pv hr{border:0;border-top:2px solid var(--sub);margin:1.5em 0}
#pv ul,#pv ol{padding-left:1.4em}#pv li{margin:.2em 0}#pv input{margin-right:.5em}
#drop{position:fixed;inset:12px;border:3px dashed var(--main);border-radius:16px;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--main);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-size:24px;z-index:20;pointer-events:none}#drop small{font-size:14px;color:var(--sub)}body.drag #drop{display:flex}
body.live #ta{position:absolute!important;left:0;top:0;width:100%;height:1px!important;min-height:0!important;opacity:0;overflow:hidden;pointer-events:none}
body.live #hl{display:none}
#lv{display:none;position:relative;min-height:46vh;font-family:"Lexend Deca",system-ui,sans-serif;font-size:calc(var(--fs)*.62);line-height:1.7;color:var(--text);cursor:text;user-select:none;-webkit-user-select:none}
body.live #lv{display:block}
#lv .ln{padding:.1em 0;min-height:1.7em;white-space:pre-wrap;overflow-wrap:break-word}
#lv .ln.empty:only-child::before{content:'start typing…';color:var(--sub)}
#lv .ln:not(.act) .mk{display:none}
#lv .ln.act .mk{color:var(--sub);font-size:.8em}
#lv .h1,#lv .h2,#lv .h3,#lv .h4,#lv .h5,#lv .h6{font-weight:600;color:var(--main);line-height:1.3}
#lv .h1{font-size:1.9em;padding-top:.35em}#lv .h2{font-size:1.55em;padding-top:.3em}#lv .h3{font-size:1.3em}#lv .h4{font-size:1.15em}#lv .h5,#lv .h6{font-size:1em}
#lv .quote{border-left:3px solid var(--sub);padding-left:14px;color:color-mix(in srgb,var(--text) 65%,var(--sub))}
#lv .li{position:relative;padding-left:calc(1.5em + var(--ind,0em))}
#lv .ul:not(.act)::before{content:'•';position:absolute;left:calc(.4em + var(--ind,0em));color:var(--main)}
#lv .tk:not(.act)::before{content:'☐';position:absolute;left:calc(.2em + var(--ind,0em));color:var(--main)}
#lv .tk.done:not(.act)::before{content:'☑'}
#lv .num{color:var(--main)}
#lv .done .tx{text-decoration:line-through;color:var(--sub)}
#lv .code{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.85em;background:var(--alt);padding:.1em 14px;line-height:1.6}
#lv .fence{color:var(--sub)}
#lv .hr:not(.act)::after{content:'';display:block;border-top:2px solid var(--sub);margin:.7em 0}
#lv strong{font-weight:600}#lv em{font-style:italic}#lv del{text-decoration:line-through}
#lv .ic2{font-family:"Roboto Mono",ui-monospace,monospace;font-size:.88em;background:var(--alt);padding:.1em .3em;border-radius:4px}
#lv .lk{color:var(--main);text-decoration:underline}
::highlight(qsel){background-color:color-mix(in srgb,var(--main) 38%,transparent)}

<script>
const $=s=>document.querySelector(s),ta=$('#ta'),mir=$('#mir'),caret=$('#caret'),wrap=$('#wrap');
const T={
 mint:{bg:'#16365a',main:'#6fdc9d',caret:'#6fdc9d',sub:'#356b8c',alt:'#12304f',text:'#e3f3ea'},
 amber:{bg:'#323437',main:'#e2b714',caret:'#e2b714',sub:'#646669',alt:'#2c2e31',text:'#d1d0c5'},
 frost:{bg:'#242933',main:'#d8dee9',caret:'#d8dee9',sub:'#617b94',alt:'#1d222b',text:'#d8dee9'},
 violet:{bg:'#282a36',main:'#bd93f9',caret:'#f8f8f2',sub:'#6272a4',alt:'#232530',text:'#f8f8f2'},
 ember:{bg:'#313131',main:'#f66e0d',caret:'#f66e0d',sub:'#616161',alt:'#2a2a2a',text:'#f5e6c8'},

};

 for(const k in t)r.setProperty('--'+k,t[k]);

 caret.className=(S.smooth?'smooth ':'')+S.caret;
 $('#info').style.opacity=S.stats?1:0;$('#thn').textContent=S.theme+' · v4';if(S.lang!=='md')S.preview=false;document.body.classList.toggle('md',S.lang==='md');document.body.classList.toggle('live',liveOn());if(!liveOn()){lv.textContent='';if(window.CSS&&CSS.highlights)CSS.highlights.delete('qsel')}document.body.classList.toggle('code',S.lang!=='text');wrap.style.display=S.preview?'none':'';$('#pv').style.display=S.preview?'block':'none';if(S.preview)mdRender(ta.value);document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===S.lang));stats();
 document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',!!S[b.dataset.t]));
 document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===S.caret));
 document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===S.size));
 measure();grow();hl();pos(true);saveS();
}
function grow(){ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight,innerHeight*.46)+'px'}
function stats(){const v=ta.value,w=(v.trim().match(/\S+/g)||[]).length;$('#info').textContent=w+(w===1?' word':' words')+' · '+v.length+(v.length===1?' char':' chars')+' · '+(v?v.split('\n').length:0)+(v.split('\n').length===1?' line':' lines')+(S.lang!=='text'?' · '+LN[S.lang]:'')}

function renderLive(){
 const src=ta.value.split('\n'),frag=document.createDocumentFragment();lv.textContent='';LV=[];WM=new WeakMap();prevAct=[];
